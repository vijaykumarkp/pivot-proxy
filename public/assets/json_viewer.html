<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>PIVOT RFQ - Downloaded JSON</title>
<style>
* { box-sizing: border-box; margin:0; padding:0; font-family: -apple-system, "Segoe UI", Arial, sans-serif; }
body { background:#0f172a; padding:28px; }
.topbar { display:flex; align-items:center; gap:12px; margin-bottom:16px; }

.filename { color:#94a3b8; font-family: "SF Mono", Consolas, monospace; font-size:14px; }
.badge { margin-left:auto; background:#166534; color:#dcfce7; font-size:12px; font-weight:700; padding:4px 10px; border-radius:6px; }
pre { background:#1e293b; border:1px solid #334155; border-radius:10px; padding:22px; color:#e2e8f0; font-family:"SF Mono", Consolas, monospace; font-size:13.5px; line-height:1.55; overflow:auto; }
.key { color:#7dd3fc; }
.str { color:#86efac; }
.status-extracted { color:#4ade80; font-weight:700; }
.status-clarification { color:#fbbf24; font-weight:700; }
.status-missing { color:#f87171; font-weight:700; }
</style></head>
<body>
<div class="topbar">
  <div class="dot" style="background:#ef4444"></div><div class="dot" style="background:#eab308"></div><div class="dot" style="background:#22c55e"></div>

function colorize(s) {
