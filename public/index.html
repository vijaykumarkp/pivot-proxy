<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attributum - PIVOT Automation Suite</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS: local build (no CDN dependency) -->
    <link href="/assets/tailwind.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #06b6d4 100%);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .logo-text {
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .pivot-blue {
            background-color: #1e3a8a;
        }
        .pivot-light {
            background-color: #3b82f6;
        }
        .pivot-cyan {
            background-color: #06b6d4;
        }
        /* Safety net: constrain ALL images in headers even if Tailwind fails to load */
        header img {
            max-height: 56px !important;
            max-width: 180px !important;
            width: auto !important;
            height: auto !important;
            object-fit: contain !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="app-new.js"></script>
</body>
</html>
