<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIVOT Automation Suite - Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 40%, #1d4ed8 70%, #0891b2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.08);
            overflow: hidden;
            animation: fadeIn 0.6s ease-out;
        }

        .accent-bar {
            height: 4px;
            background: linear-gradient(90deg, #1e3a8a, #3b82f6, #06b6d4);
        }

        .card-inner {
            padding: 40px 36px 32px;
        }

        /* Logo section */
        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logos-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .logos-row img {
            max-height: 44px;
            max-width: 160px;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .logo-divider {
            width: 1px;
            height: 30px;
            background: #e2e8f0;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
            font-weight: 500;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 8px;
        }

        .form-label i {
            color: #3b82f6;
            margin-right: 6px;
            font-size: 11px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
            text-align: center;
            letter-spacing: 3px;
            color: #1e293b;
            background: #f8fafc;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input::placeholder {
            color: #cbd5e1;
            letter-spacing: 1px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
        }

        .form-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
            background: #fff;
        }

        /* Messages */
        .msg-box {
            display: none;
            margin-bottom: 16px;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            font-size: 13px;
            animation: slideDown 0.3s ease-out;
        }

        .msg-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
        }

        .msg-expired {
            background: #fffbeb;
            border: 1px solid #fde68a;
            color: #92400e;
        }

        .msg-expired .expired-icon {
            font-size: 20px;
            color: #f59e0b;
            display: block;
            margin-bottom: 8px;
        }

        .msg-expired .expired-title {
            font-weight: 600;
            font-size: 14px;
            color: #92400e;
        }

        .msg-expired .expired-detail {
            font-size: 12px;
            color: #b45309;
            margin-top: 4px;
        }

        .msg-expired .contact-link {
            display: inline-block;
            margin-top: 10px;
            font-size: 12px;
            background: #fef3c7;
            color: #92400e;
            padding: 6px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s;
        }

        .msg-expired .contact-link:hover {
            background: #fde68a;
        }

        /* Button */
        .submit-btn {
            width: 100%;
            padding: 14px 16px;
            background: linear-gradient(135deg, #1e40af, #1d4ed8);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(30, 64, 175, 0.35);
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #1e3a8a, #1e40af);
            box-shadow: 0 6px 20px rgba(30, 64, 175, 0.45);
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-hidden { display: none; }

        /* Footer */
        .footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
            text-align: center;
        }

        .footer-secure {
            font-size: 11px;
            color: #94a3b8;
        }

        .footer-secure i {
            margin-right: 4px;
        }

        .footer-demo {
            font-size: 10px;
            color: #cbd5e1;
            margin-top: 6px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Fallback logo */
        .fallback-logo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .fallback-icon {
            width: 36px;
            height: 36px;
            background: #1e3a8a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 16px;
        }

        .fallback-text {
            font-size: 16px;
            font-weight: 700;
            color: #1e3a8a;
            letter-spacing: 1.5px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25%      { transform: translateX(-8px); }
            75%      { transform: translateX(8px); }
        }

        .shake { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body>
    <div class="card">
        <div class="accent-bar"></div>
        <div class="card-inner">

            <!-- Logo Area -->
            <div class="logo-section">
                <div class="logos-row">
                    <img src="/logos/attributum-logo.png" alt="Attributum"
                         onerror="this.outerHTML='<div class=\'fallback-logo\'><div class=\'fallback-icon\'>A</div><span class=\'fallback-text\'>ATTRIBUTUM</span></div>'">
                    <div class="logo-divider"></div>
                    <img src="/logos/pivot-logo.png" alt="PIVOT"
                         onerror="this.style.display=\'none\'">
                </div>
                <div class="title">PIVOT Automation Suite</div>
                <div class="subtitle">Client Sandbox Environment</div>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="accessCode" class="form-label">
                        <i class="fas fa-key"></i>Access Code
                    </label>
                    <input
                        type="text"
                        id="accessCode"
                        name="accessCode"
                        placeholder="Enter your access code"
                        autocomplete="off"
                        class="form-input"
                        required
                        autofocus
                    >
                </div>

                <!-- Error Message -->
                <div id="errorMsg" class="msg-box msg-error"></div>

                <!-- Expired Message -->
                <div id="expiredMsg" class="msg-box msg-expired">
                    <i class="fas fa-hourglass-end expired-icon"></i>
                    <div class="expired-title">Trial Period Ended</div>
                    <div class="expired-detail">Your access has expired. Contact sales to renew.</div>
                    <a href="mailto:pivot@attributum.com" class="contact-link">
                        <i class="fas fa-envelope"></i> Contact Sales
                    </a>
                </div>

                <button type="submit" id="loginBtn" class="submit-btn">
                    <span id="btnText"><i class="fas fa-arrow-right" style="margin-right:8px"></i>Enter Sandbox</span>
                    <span id="btnLoader" class="btn-hidden"><i class="fas fa-circle-notch fa-spin" style="margin-right:8px"></i>Verifying...</span>
                </button>
            </form>

            <!-- Footer -->
            <div class="footer">
                <div class="footer-secure">
                    <i class="fas fa-shield-alt"></i> Secure sandbox environment
                </div>
                <div class="footer-demo">Demo — For Evaluation Only</div>
            </div>

        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();

            const code = document.getElementById('accessCode').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const expiredMsg = document.getElementById('expiredMsg');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const loginBtn = document.getElementById('loginBtn');
            const input = document.getElementById('accessCode');

            // Reset messages
            errorMsg.style.display = 'none';
            expiredMsg.style.display = 'none';

            if (!code) return;

            // Loading state
            btnText.style.display = 'none';
            btnLoader.style.display = 'inline';
            loginBtn.disabled = true;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ access_code: code })
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = '/';
                } else if (data.expired) {
                    expiredMsg.style.display = 'block';
                    input.classList.add('shake');
                    setTimeout(() => input.classList.remove('shake'), 400);
                } else {
                    errorMsg.textContent = data.error || 'Invalid access code';
                    errorMsg.style.display = 'block';
                    input.classList.add('shake');
                    setTimeout(() => input.classList.remove('shake'), 400);
                }
            } catch (err) {
                errorMsg.textContent = 'Connection error. Please try again.';
                errorMsg.style.display = 'block';
            } finally {
                btnText.style.display = 'inline';
                btnLoader.style.display = 'none';
                loginBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
