<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIVOT Automation Suite - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #06b6d4 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }
        .input-focus:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade { animation: fadeIn 0.6s ease-out; }
        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="glass-card rounded-2xl p-8 w-full max-w-md animate-fade">
        <!-- Logo Area -->
        <div class="text-center mb-8">
            <div class="flex items-center justify-center gap-3 mb-4">
                <img src="/logos/attributum-logo.png" alt="Attributum" class="h-10" onerror="this.style.display='none'">
            </div>
            <h1 class="text-2xl font-bold text-gray-800 tracking-wide">PIVOT Automation Suite</h1>
            <p class="text-gray-500 mt-2 text-sm">Client Sandbox Environment</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-6">
                <label for="accessCode" class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-key mr-1 text-blue-500"></i> Access Code
                </label>
                <input
                    type="text"
                    id="accessCode"
                    name="accessCode"
                    placeholder="Enter your access code"
                    autocomplete="off"
                    class="input-focus w-full px-4 py-3 border-2 border-gray-200 rounded-xl text-gray-800
                           placeholder-gray-400 transition-all duration-200 outline-none text-center
                           tracking-widest font-mono text-lg"
                    required
                    autofocus
                >
            </div>

            <!-- Error Message -->
            <div id="errorMsg" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm text-center">
            </div>

            <!-- Expired Message -->
            <div id="expiredMsg" class="hidden mb-4 p-4 bg-amber-50 border border-amber-200 rounded-xl text-center">
                <i class="fas fa-clock text-amber-500 text-2xl mb-2"></i>
                <p class="text-amber-700 font-medium">Trial Period Ended</p>
                <p class="text-amber-600 text-sm mt-1">Your access has expired. Contact sales to renew.</p>
                <a href="mailto:pivot@attributum.com"
                   class="inline-block mt-3 text-sm text-blue-600 hover:text-blue-800 font-medium">
                    <i class="fas fa-envelope mr-1"></i> Contact Sales
                </a>
            </div>

            <button
                type="submit"
                id="loginBtn"
                class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-semibold
                       rounded-xl hover:from-blue-700 hover:to-blue-800 transition-all duration-200
                       shadow-lg hover:shadow-xl active:scale-[0.98]"
            >
                <span id="btnText"><i class="fas fa-sign-in-alt mr-2"></i>Enter Sandbox</span>
                <span id="btnLoader" class="hidden"><i class="fas fa-spinner fa-spin mr-2"></i>Verifying...</span>
            </button>
        </form>

        <!-- Footer -->
        <div class="mt-8 pt-6 border-t border-gray-100 text-center">
            <p class="text-xs text-gray-400">
                <i class="fas fa-shield-alt mr-1"></i> Secure sandbox environment
            </p>
            <p class="text-xs text-gray-300 mt-1">
                DEMO — FOR EVALUATION ONLY
            </p>
        </div>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();

            const code = document.getElementById('accessCode').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const expiredMsg = document.getElementById('expiredMsg');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const loginBtn = document.getElementById('loginBtn');
            const form = document.getElementById('loginForm');

            // Reset messages
            errorMsg.classList.add('hidden');
            expiredMsg.classList.add('hidden');

            if (!code) return;

            // Show loading state
            btnText.classList.add('hidden');
            btnLoader.classList.remove('hidden');
            loginBtn.disabled = true;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ access_code: code })
                });

                const data = await response.json();

                if (data.success) {
                    // Successful login - redirect to dashboard
                    window.location.href = '/';
                } else if (data.expired) {
                    // Show expired message
                    expiredMsg.classList.remove('hidden');
                    form.querySelector('input').classList.add('shake');
                    setTimeout(() => form.querySelector('input').classList.remove('shake'), 400);
                } else {
                    // Invalid code
                    errorMsg.textContent = data.error || 'Invalid access code';
                    errorMsg.classList.remove('hidden');
                    form.querySelector('input').classList.add('shake');
                    setTimeout(() => form.querySelector('input').classList.remove('shake'), 400);
                }
            } catch (err) {
                errorMsg.textContent = 'Connection error. Please try again.';
                errorMsg.classList.remove('hidden');
            } finally {
                btnText.classList.remove('hidden');
                btnLoader.classList.add('hidden');
                loginBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
